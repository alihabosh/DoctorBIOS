<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DoctorBIOS Diamond</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
<h2>DoctorBIOS 💎 Diamond</h2>
<ul>
<li>Home</li>
<li>Services</li>
<li>Upload</li>
<li>Contact</li>
</ul>
</nav>

<div class="hero">
<h1>Upgrade Your Repair Business</h1>
<p>Professional BIOS Repair & Unlock Service</p>

<a class="btn whatsapp">WhatsApp 24/7</a>
<a class="btn telegram">Telegram Support</a>
<a class="btn tiktok">TikTok</a>
<a class="btn youtube">YouTube</a>
</div>

<div class="upload-section">
<h2>Upload BIOS File</h2>

<form action="/upload" method="POST" enctype="multipart/form-data">

<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="whatsapp" placeholder="WhatsApp Number" required>

<select name="brand" required>
<option value="">Laptop Brand</option>
<option>Dell</option>
<option>HP</option>
<option>Lenovo</option>
<option>Asus</option>
<option>Acer</option>
<option>Huawei</option>
<option>MSI</option>
<option>Samsung</option>
<option>Sony</option>
<option>Toshiba</option>
<option>Apple</option>
<option>Panasonic</option>
</select>

<input type="text" name="model" placeholder="Model" required>
<input type="text" name="serial" placeholder="Serial Number" required>

<input type="file" name="bios" required>

<button type="submit">Upload File</button>

</form>
</div>

</body>
</html>
