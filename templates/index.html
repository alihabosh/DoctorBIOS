<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. BIOS | Ali Haboush 3D Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<canvas id="matrix"></canvas> <!-- خلفية الماتريكس المتحركة -->

<div class="navbar">
    <h2 class="logo">Dr. BIOS 💎</h2>
    <ul>
        <li><a href="https://www.youtube.com/@ALIHABOSH" target="_blank">Academy</a></li>
        <li><a href="https://t.me/+Q_Fl_dVGSac5ZGVk" target="_blank">Telegram</a></li>
    </ul>
</div>

<div class="hero">
    <div class="bios-3d-animation">
        <div class="cube">
            <div class="face front">BIOS</div>
            <div class="face back">UNLOCK</div>
            <div class="face right">CLEAR</div>
            <div class="face left">DMI</div>
            <div class="face top">T2</div>
            <div class="face bottom">ALI</div>
        </div>
    </div>
    <h1>Upgrade Your Business With <span>Dr. BIOS 🚀</span></h1>
    <p>Professional Chip-Level Solutions by Ali Haboush</p>
</div>

<div class="services-grid">
    <div class="service-card">
        <i class="fas fa-unlock"></i>
        <h3>Unlock</h3>
        <p>BIOS & EFI PIN</p>
    </div>
    <div class="service-card">
        <i class="fas fa-microchip"></i>
        <h3>Clear ME</h3>
        <p>Clean Regions</p>
    </div>
    <div class="service-card">
        <i class="fas fa-copy"></i>
        <h3>DMI Data</h3>
        <p>Copy & Fix Info</p>
    </div>
</div>

<div class="upload-section">
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="whatsapp" placeholder="WhatsApp Number" required>
        <select name="service_type" required>
            <option value="Unlock">BIOS Unlock</option>
            <option value="Clear ME">Clear ME</option>
            <option value="T2">Mac iCloud T2</option>
        </select>
        <input type="text" name="model" placeholder="Model" required>
        <input type="text" name="serial" placeholder="Serial" required>
        <input type="file" name="bios" required>
        <button type="submit">SUBMIT REPAIR 🛠️</button>
    </form>
</div>

<script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 33);
</script>
</body>
</html>
