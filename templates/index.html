
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DoctorBIOS Upload</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<h2>DoctorBIOS Service</h2>
<form action="/upload" method="POST" enctype="multipart/form-data" class="upload-form">
<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="whatsapp" placeholder="WhatsApp Number" required>

<select name="brand" required>
<option value="">Laptop Brand</option>
<option>Dell</option>
<option>HP</option>
<option>Lenovo</option>
<option>Asus</option>
<option>Acer</option>
<option>Huawei</option>
<option>Redmi</option>
<option>Apple</option>
<option>Panasonic</option>
<option>MSI</option>
<option>Samsung</option>
<option>Sony</option>
<option>Toshiba</option>
<option>Fujitsu</option>
<option>Gigabyte</option>
<option>Microsoft Surface</option>
<option>Razer</option>
<option>Intel</option>
</select>

<input type="text" name="model" placeholder="Model" required>
<input type="text" name="serial" placeholder="Serial Number" required>
<input type="file" name="bios" required>

<button type="submit">Submit Job</button>
</form>
</div>
</body>
</html>
