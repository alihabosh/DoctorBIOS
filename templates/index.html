<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DoctorBIOS Upload</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">DoctorBIOS Diamond 💎</div>
</header>

<section class="upload-box">
<h2>Upload BIOS File</h2>

<form id="uploadForm" enctype="multipart/form-data">
<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="whatsapp" placeholder="WhatsApp Number" required>
<input type="text" name="brand" placeholder="Laptop Brand" required>
<input type="text" name="model" placeholder="Model" required>
<input type="text" name="serial" placeholder="Serial Number" required>

<input type="file" name="bios" required>

<button type="submit">Submit Job</button>
</form>

</section>

<script>
document.getElementById("uploadForm").addEventListener("submit", function(e) {
e.preventDefault();

const formData = new FormData(this);

fetch("/upload", {
method: "POST",
body: formData
})
.then(res => res.text())
.then(data => {
alert(data);
});
});
</script>

</body>
</html>
