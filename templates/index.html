<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor BIOS | All Laptops Repair</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_4.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">DOCTOR <span>BIOS</span> <i class="fas fa-microchip"></i></a>
        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> <span>HOME</span></a></li>
            <li><a href="https://www.youtube.com/@DoctorBIOS" target="_blank"><i class="fab fa-youtube"></i> <span>YOUTUBE</span></a></li>
            <li><a href="https://t.me/DoctorBIOS" target="_blank"><i class="fab fa-telegram"></i> <span>TELEGRAM</span></a></li>
        </ul>
        <a href="#" class="btn-contact">CONTACT SUPPORT</a>
    </nav>

    <main class="main-container">
        <div class="content-wrapper">
            <div class="text-side">
                <h1>ART OF BIOS REPAIR<br><span>FOR ALL LAPTOPS</span></h1>
                <div class="upload-container">
                    <form action="/upload" method="POST" enctype="multipart/form-data">
                        <div class="input-row">
                            <input type="text" name="whatsapp" placeholder="WHATSAPP NUMBER" required>
                            <input type="text" name="name" placeholder="FULL NAME" required>
                        </div>
                        <select name="brand" required>
                            <option value="" disabled selected>SELECT BRAND</option>
                            <option value="hp">HP</option>
                            <option value="dell">DELL</option>
                            <option value="lenovo">LENOVO</option>
                            <option value="apple">APPLE</option>
                            <option value="other">OTHER</option>
                        </select>
                        <input type="text" name="model" placeholder="MODEL" required>
                        <input type="text" name="serial" placeholder="SERIAL" required>
                        <input type="file" name="bios" required>
                        <button type="submit" class="submit-btn">START REPAIR</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
