<!DOCTYPE html>
<html>
<head>
    <title>DoctorBIOS Upload</title>
</head>
<body>

<h2>DoctorBIOS Upload System</h2>

<form id="uploadForm" enctype="multipart/form-data">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>WhatsApp:</label><br>
    <input type="text" name="whatsapp" required><br><br>

    <label>Brand:</label><br>
    <input type="text" name="brand" required><br><br>

    <label>Model:</label><br>
    <input type="text" name="model" required><br><br>

    <label>Serial:</label><br>
    <input type="text" name="serial" required><br><br>

    <label>Upload BIOS:</label><br>
    <input type="file" name="bios" required><br><br>

    <button type="submit">Submit Job</button>
</form>

<script>
document.getElementById("uploadForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("/submit_job", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => {
        alert(data);
    });
});
</script>

</body>
</html>
