<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<canvas id="matrix"></canvas>

<div class="navbar">
    <h2 class="logo">Doctor BIOS 💎</h2>
    <div class="social-nav">
        <a href="https://wa.me/96176737184" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://t.me/+umBA7AesEX82YmM8" target="_blank"><i class="fab fa-telegram"></i></a>
        <a href="https://www.tiktok.com/@alihabosh" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.youtube.com/@ALIHABOSH" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
</div>

<div class="hero">
    <div class="container-3d">
        <div class="cube-3d">
            <div class="side front">BIOS</div>
            <div class="side back">REPAIR</div>
            <div class="side right">NVRAM</div>
            <div class="side left">RAM</div>
            <div class="side top">UNLOCK</div>
            <div class="side bottom">AI</div>
        </div>
    </div>
    <h1>Upgrade Your Business With <br> <span>Doctor BIOS AI 🚀</span></h1>
    <p>Professional Chip-Level Solutions by Ali Haboush</p>
</div>

<div class="services-container">
    <div class="card-3d">
        <i class="fas fa-microchip"></i>
        <h3>Repair BIOS</h3>
        <p>Fix Corrupted Files</p>
    </div>
    <div class="card-3d">
        <i class="fas fa-memory"></i>
        <h3>Reset NVRAM</h3>
        <p>Clear ME Regions</p>
    </div>
    <div class="card-3d">
        <i class="fas fa-ban"></i>
        <h3>Disable RAM</h3>
        <p>On-Board RAM Fix</p>
    </div>
</div>

<div class="upload-section">
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="whatsapp" placeholder="WhatsApp Number" required>
        
        <select name="service_type" required>
            <option value="">-- Select AI Service --</option>
            <option value="Repair BIOS">Repair BIOS File</option>
            <option value="Reset NVRAM">Reset NVRAM / Clear ME</option>
            <option value="Disable RAM">Disable Built-in RAM</option>
            <option value="Unlock T2">Mac iCloud T2 Unlock</option>
        </select>

        <input type="text" name="brand" placeholder="Laptop Brand" required>
        <input type="text" name="model" placeholder="Model" required>
        <input type="text" name="serial" placeholder="Serial Number" required>
        
        <input type="file" name="bios" id="bios" required>
        <button type="submit">SUBMIT TO AI REPAIR 🛠️</button>
    </form>
</div>

<script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 33);
</script>
</body>
</html>
