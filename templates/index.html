<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor BIOS | Premium Repair</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <div class="logo">DOCTOR BIOS 💎</div>
    <ul style="display:flex; list-style:none; gap:20px;">
        <li>Home</li>
        <li>Track Order</li>
        <li>About</li>
    </ul>
</div>

<div class="hero" style="margin-top:80px;">
    <h1 style="font-size: 50px;">ART OF BIOS REPAIR <br>WITH A <span style="color:#d4af37;">PREMIUM</span> TOUCH</h1>
    <p style="color:#888;">Professional BIOS Unlock & Firmware Engineering</p>
</div>

<div class="upload-section">
    <h2 style="margin-top:0;">QUICK SUBMISSION</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="whatsapp" placeholder="WhatsApp Number" required>
        <select name="brand" required>
            <option value="">Select Brand</option>
            <option>Dell</option>
            <option>HP</option>
            <option>Lenovo</option>
            <option>MacBook</option>
            <option>Asus</option>
        </select>
        <input type="text" name="model" placeholder="Model (e.g. Tecra A50)" required>
        <input type="text" name="serial" placeholder="Serial Number" required>
        <input type="file" name="bios" required>
        <button type="submit">SUBMIT TO LAB</button>
    </form>
</div>

</body>
</html>
